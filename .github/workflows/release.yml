name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.sys.os }} 
    strategy:
      matrix:
        sys:
          - { name: linux-glibc, os: ubuntu-latest,  shell: bash,                   osx_architectures: '' }
          - { name: linux-musl,  os: ubuntu-latest,  shell: 'alpine.sh --root {0}', osx_architectures: '' }
          - { name: windows,     os: windows-latest, shell: pwsh,                   osx_architectures: '' }
          - { name: mac,         os: macos-latest,   shell: bash,                   osx_architectures: 'arm64' }
          - { name: mac,         os: macos-latest,   shell: bash,                   osx_architectures: 'x86_64' }
    defaults:
      run:
        shell: ${{ matrix.sys.shell }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    
    - name: Setup latest Alpine Linux
      uses: jirutka/setup-alpine@ae3b3ddba35054804fc4a3507b519fa7e8152050
      if: ${{ matrix.sys.name == 'linux-musl' }}
      with:
        arch: x86_64
        packages: >
          binutils
          clang22
          cmake
          g++
          git
          libstdc++
          musl-dev
          ninja-is-really-ninja

    - name: Git Safe Directory
      if: ${{ matrix.sys.os == 'ubuntu-latest' }}
      run: git config --global --add safe.directory ${{github.workspace}}

    - name: Configure CMake
      env:
        USE_MUSL_LIBC: ${{ matrix.sys.name == 'linux-musl' }}
      run: cmake -B ${{github.workspace}}/build --preset release -DCMAKE_OSX_ARCHITECTURES=${{matrix.sys.osx_architectures}} -DUSE_MUSL_LIBC=${{env.USE_MUSL_LIBC}} -DZIP_RELEASE=1

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure

    - name: Release
      uses: ncipollo/release-action@1b9acf6ded5a3b65414f069bb0c2c847ac83a145
      with:
        name: ${{ github.ref }}
        tag: ${{ github.ref }}
        artifacts: build/ccc_*.zip
        allowUpdates: true
        draft: true
        replacesArtifacts: false
